plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0, 6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.38'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()

repositories {
    //maven { url 'https://maven.blamejared.com' }
    //maven { url 'https://maven.theillusivec4.top' }
}

group = 'uk.kihira'
version = '2.1.2+1.20.1'

base {
    archivesName = 'Tails'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.1.3'

    //compileOnly fg.deobf('vazkii.botania:Botania:1.18.2-434:api')
    //runtimeOnly fg.deobf('vazkii.botania:Botania:1.18.2-434')
    //runtimeOnly fg.deobf('vazkii.patchouli:Patchouli:1.19.2-76')
    //runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.2.0-beta.3+1.20.1')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
	accessTransformer = file("$rootDir/src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        configureEach {
            arg '-mixin.config=mixins.tails.json'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                tails {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run')
        }

        server {
            workingDirectory project.file('run/server')
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'Tails',
            'Specification-Vendor': 'Kihira',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': "${version}",
            'Implementation-Vendor': 'EnderTurret',
            'MixinConfigs': 'mixins.tails.json'
        ])
    }
    finalizedBy('reobfJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact sourcesJar

            pom {
                name = 'Tails'
                description = 'For all your taily needs.'
            }

            pom.withXml {
                asNode().dependencies.dependency.each { dep ->
                    if (dep.artifactId.last().value().last().contains('forge'))
                        dep.parent().remove(dep)
                }
            }
        }
    }
}