group = 'uk.kihira'

subprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'

    java.withSourcesJar()

    group = 'uk.kihira'
    version = "${mod_version}+${loader}"

    base {
        archivesName = 'Tails'
    }

    repositories {
        maven {
            url = 'https://maven.blamejared.com'
            content {
                includeGroup 'vazkii.botania'
                includeGroup 'vazkii.patchouli'
            }
        }
        maven {
            url = 'https://maven.theillusivec4.top'
            content {
                includeGroup 'top.theillusivec4.curios'
            }
        }
        maven {
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
        mavenLocal {
            content {
                includeGroup 'net.enderturret'
            }
        }
    }

    tasks.named('processResources', ProcessResources).configure {
        doLast {
            fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
                File file -> file.text = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(file))
            }
        }
    }

    tasks.named('jar', Jar).configure {
        manifest {
            attributes([
                'Specification-Title': 'Tails',
                'Specification-Vendor': 'Kihira',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': "${version}",
                'Implementation-Vendor': 'EnderTurret'
            ])
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    configurations {
        localImplementation
        compileClasspath.extendsFrom localImplementation
        runtimeClasspath.extendsFrom localImplementation
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = "Tails-${loader}"
                version = "${mod_version}"

                from components.java

                pom {
                    description = 'For all your taily needs.'
                }
            }
        }
    }

    if (it != project(':Tails.Common')) {
        tasks.named('compileJava', JavaCompile).configure {
            source project(':Tails.Common').sourceSets.main.allSource
        }

        tasks.named('sourcesJar', Jar).configure {
            from project(':Tails.Common').sourceSets.main.allJava
        }

        tasks.named('processResources', ProcessResources).configure {
            from project(':Tails.Common').sourceSets.main.resources
        }

        dependencies {
            localImplementation (project(':Tails.Common'))
        }
    }
}