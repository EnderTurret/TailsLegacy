pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven {
            // RetroFuturaGradle
            name = 'GTNH Maven'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroup 'com.gtnewhorizons.retrofuturagradle'
            }
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Tails'

include('common', 'forge-1.7.10', 'forge-1.12.2', 'forge-1.18.2', 'forge-1.19.2', 'forge-1.20.1', 'neoforge-1.21.1', 'neoforge-1.21.11', 'neoforge-26.1')
project(':common').name = 'Tails.Common'
project(':forge-1.7.10').name = 'Tails.Forge.1.7.10'
project(':forge-1.12.2').name = 'Tails.Forge.1.12.2'
project(':forge-1.18.2').name = 'Tails.Forge.1.18.2'
project(':forge-1.19.2').name = 'Tails.Forge.1.19.2'
project(':forge-1.20.1').name = 'Tails.Forge.1.20.1'
project(':neoforge-1.21.1').name = 'Tails.NeoForge.1.21.1'
//project(':neoforge-1.21.10').name = 'Tails.NeoForge.1.21.10'
project(':neoforge-1.21.11').name = 'Tails.NeoForge.1.21.11'
project(':neoforge-26.1').name = 'Tails.NeoForge.26.1'