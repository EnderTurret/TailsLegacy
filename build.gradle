group = 'uk.kihira'

subprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    java.withSourcesJar()

    group = 'uk.kihira'
    version = "${mod_version}+${loader}"

    base {
        archivesName = 'Tails'
    }

    repositories {
        //maven { url 'https://maven.blamejared.com' }
        //maven { url 'https://maven.theillusivec4.top' }
    }

    tasks.named('processResources', ProcessResources).configure {
        doLast {
            fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
                File file -> file.text = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(file))
            }
        }
    }

    tasks.named('jar', Jar).configure {
        manifest {
            attributes([
                'Specification-Title': 'Tails',
                'Specification-Vendor': 'Kihira',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': "${version}",
                'Implementation-Vendor': 'EnderTurret'
            ])
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    if (it != project(':Tails.Common')) {
        tasks.named('compileJava', JavaCompile).configure {
            source project(':Tails.Common').sourceSets.main.allSource
        }

        tasks.named('sourcesJar', Jar).configure {
            from project(':Tails.Common').sourceSets.main.allJava
        }

        tasks.named('processResources', ProcessResources).configure {
            from project(':Tails.Common').sourceSets.main.resources
        }

        dependencies {
            implementation (project(':Tails.Common'))
        }
    }
}

