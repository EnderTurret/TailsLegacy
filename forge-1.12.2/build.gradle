plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

repositories {
    maven {
        name = 'CleanroomMC Maven'
        url = 'https://maven.cleanroommc.com'
    }
}

dependencies {
    String mixin = modUtils.enableMixins("zone.rong:mixinbooter:${mixinbooter_version}", 'tailslegacy.refmap.json')
    implementation (mixin)
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    annotationProcessor (mixin)

    compileOnly 'org.jetbrains:annotations:24.0.1'

    compileOnly "vazkii.botania:Botania:r1.10-364.4:api"
    implementation rfg.deobf("net.enderturret:VariableSkins-${minecraft_version}-forge:${variableskins_version}")
}

minecraft {
    usesFml = true
    usesForge = true

    mcVersion.set("${minecraft_version}")

    mcpMappingChannel.set("${mappings_channel}")
    mcpMappingVersion.set("${mappings_version}")

    username.set(rootProject.findProperty('minecraft_username'))
    userUUID.set(rootProject.findProperty('minecraft_uuid'))

    // JVM args for remote debugging via IDE
    extraRunJvmArguments.add('-Xdebug')
    extraRunJvmArguments.add('-Xrunjdwp:transport=dt_socket,address=8413,server=y,suspend=n')

    //extraRunJvmArguments.add('-Dmixin.debug.export=true')
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property 'version', project.version

    from (sourceSets.main.resources.srcDirs) {
        include 'mcmod.info', 'version.properties'
        expand 'version': project.version
    }

    from (sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info', 'version.properties'
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'FMLCorePlugin': 'uk.kihira.tails.forge.asm.TailsPlugin',
        'FMLCorePluginContainsFMLMod': true
    ])
}

