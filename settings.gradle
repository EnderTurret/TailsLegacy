pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Tails'

include('common', 'neoforge-1.21.1', 'neoforge-1.21.10')
project(':common').name = 'Tails.Common'
project(':neoforge-1.21.1').name = 'Tails.NeoForge.1.21.1'
project(':neoforge-1.21.10').name = 'Tails.NeoForge.1.21.10'